# ==============================================================================
#                  ApexPvP Adventure MiniMessage Language Strings
# ==============================================================================

prefix: "<gradient:#FF5555:#FFAA00><bold>ApexPvP</bold></gradient> <dark_gray>»</dark_gray> <gray>"

general:
  no-permission: "<red>You lack permission to perform this action."
  player-only: "<red>This command can only be executed by in-game players."
  player-not-found: "<red>Player <gold><target></gold> is not online."
  internal-error: "<red>An internal database or match error occurred. Please contact an administrator."
  insufficient-funds: "<red>You have insufficient funds. Required: <gold><amount></gold> coins."

rank:
  upgraded: "<gradient:#00FFAA:#00AAFF><bold>RANK UP!</bold></gradient> You advanced to <rank_display><reset>!"
  threshold-reached: "<green>You have unlocked the ELO threshold for <rank_display><green>! Pay <gold><cost></gold> to rank up via <yellow>/rankup</yellow>."
  cannot-rankup: "<red>You do not meet the ELO requirements or cost to rank up."

queue:
  joined: "<green>Joined <gold><kit></gold> ranked queue. ELO: <yellow><elo></yellow>. Searching..."
  left: "<yellow>You left the matchmaking queue."
  expanded: "<dark_gray>Queue search expanded to <gold>±<range></gold> ELO..."
  match-found: "<gradient:#00FF88:#00AAFF><bold>MATCH FOUND!</bold></gradient> Opponent: <gold><opponent></gold> (<yellow><opponent_elo></yellow> ELO)."

duel:
  sent: "<green>Duel challenge sent to <gold><target></gold> with kit <yellow><kit></yellow><stake_info>."
  received: "<gradient:#FFAA00:#FF5555><bold>DUEL CHALLENGE!</bold></gradient> <gold><challenger></gold> challenged you with <yellow><kit></yellow><stake_info>!\n<click:run_command:'/duel accept <challenger>'><hover:show_text:'<green>Click to accept duel'><green><bold>[ACCEPT]</bold></green></hover></click> <click:run_command:'/duel decline <challenger>'><hover:show_text:'<red>Click to decline duel'><red><bold>[DECLINE]</bold></red></hover></click>"
  expired: "<red>Duel challenge between you and <gold><target></gold> has expired."
  declined: "<yellow><target> declined your duel challenge."
  stake-format: " for <gold><stake></gold> coins"
  escrow-refunded: "<yellow>Match was aborted. Escrow stake of <gold><stake></gold> coins has been refunded to your account."

match:
  countdown: "<yellow>Match begins in <gold><seconds></gold> seconds..."
  started: "<gradient:#00FF88:#00AAFF><bold>MATCH STARTED!</bold></gradient> Fight to the finish!"
  victory: "<gradient:#00FFAA:#FFFF55><bold>VICTORY!</bold></gradient> You defeated <gold><loser></gold>! <gray>(+<green><elo_delta></green> ELO, +<gold><reward></gold> coins)"
  defeat: "<gradient:#FF5555:#AA0000><bold>DEFEAT!</bold></gradient> You were defeated by <gold><winner></gold>. <gray>(-<red><elo_delta></red> ELO)"
