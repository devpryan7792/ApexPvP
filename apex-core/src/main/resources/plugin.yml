name: ApexPvP
version: '${version}'
main: com.apexpvp.ApexPvPPlugin
api-version: '1.20'
author: ApexPvP Team
description: Enterprise-Grade Competitive PvP Engine for Paper 26.3
depend:
  - Citizens
softdepend:
  - Vault
  - PlaceholderAPI
  - FastAsyncWorldEdit

commands:
  duel:
    description: Issue, accept, or decline a 1v1 duel challenge, or open Dueling Hub
    usage: /duel [player] [kit] [stake]
    aliases: [duels, pduels]
  queue:
    description: Join ranked matchmaking queue
    usage: /queue <kit>
  leavequeue:
    description: Leave ranked matchmaking queue
    usage: /leavequeue
  team:
    description: Team management, scrimmages, and party PvP
    usage: /team <create|invite|join|leave|disband|split|ffa|duel|info>
    aliases: [party, t]
  practice:
    description: Single-player PvE practice bot match
    usage: /practice <kit> [difficulty]
  rankup:
    description: Advance to the next competitive rank tier
    usage: /rankup
  apex:
    description: Master administrative command and solo combat simulator
    usage: /apex <simduel|eco|reload|help>
  stats:
    description: View your or another player's competitive stats and rank
    usage: /stats [player]
    aliases: [profile]
  top:
    description: View competitive ELO, wins, or streak leaderboards
    usage: /top [elo|wins|streak|<kit>]
    aliases: [leaderboard]
  bet:
    description: Wager on active duel combatants as a spectator
    usage: /bet <player> <amount>
  kits:
    description: Open the kit selection menu or configure combat kits
    usage: /kits [list|create|set|seticon|delete|give|editor]
    aliases: [kit]
  kiteditor:
    description: Open the visual kit layout editor to customize your hotbar
    usage: /kiteditor [kit]
    aliases: [editkit, layout]
  arena:
    description: Arena management, instance inspection, and spawn configuration
    usage: /arena <create|list|tp|setspawn|toggle|prebuilt|seticon|reload>
    permission: apexpvp.arena.admin
  ranked:
    description: Competitive ranked matchmaking hub, direct kit queuing, and status
    usage: /ranked [menu|queue <kit>|leave|status|<kit>]
    aliases: [rmatch]
  ffa:
    description: Join or manage Free-For-All (FFA) deathmatches
    usage: /ffa [queue <kit>|leave|status|<kit>]
    aliases: [freeforall, deathmatch]

permissions:
  apexpvp.ffa:
    description: Access to /ffa Free-For-All deathmatches
    default: true
  apexpvp.admin:
    description: Master administrator permission for ApexPvP
    default: op
    children:
      apexpvp.eco: true
      apexpvp.reload: true
      apexpvp.simduel: true
      apexpvp.kit.admin: true
      apexpvp.arena.admin: true
  apexpvp.kit:
    description: Access to /kits menu
    default: true
  apexpvp.kit.admin:
    description: Administrative kit creation and modification
    default: op
  apexpvp.arena.admin:
    description: Administrative arena creation and grid management
    default: op
  apexpvp.simduel:
    description: Access to /apex simduel solo combat simulator
    default: op
  apexpvp.duel:
    description: Access to /duel
    default: true
  apexpvp.queue:
    description: Access to /queue and /leavequeue
    default: true
  apexpvp.team:
    description: Access to /team
    default: true
  apexpvp.practice:
    description: Access to /practice
    default: true
  apexpvp.rankup:
    description: Access to /rankup
    default: true
  apexpvp.stats:
    description: Access to /stats
    default: true
  apexpvp.top:
    description: Access to /top and /leaderboard
    default: true
  apexpvp.bet:
    description: Access to /bet
    default: true
